<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abunəlik və Qeydiyyat Paneli</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #005d4e;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .checkout-card {
      background-color: #000000;
      border: 1px solid #1e293b;
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 1. PLAN SEÇİMİ: :has() + :checked */
    .plans-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .plan-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border: 2px solid #233047;
      background-color: #182238;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .plan-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .plan-card input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #38bdf8;
    }

    /* :has() - Seçilən radio olduqda bütün kartı aktivləşdirir */
    .plan-card:has(input[type="radio"]:checked) {
      border-color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.1);
    }

    .plan-name {
      font-weight: 700;
      display: block;
    }

    .plan-price {
      font-weight: 800;
      color: #38bdf8;
    }

    /* 2. FORM SAHƏLƏRİ: :focus, :has(.error-text) */
    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1.5px solid transparent;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .field-box label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .field-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0b0f19;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    /* :focus */
    .field-box input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    /* :has(.error-text) - Xəta olduqda valideyn konteyneri qırmızı et */
    .field-box:has(.error-text) input {
      border-color: #ef4444;
    }

    .error-text {
      font-size: 0.75rem;
      color: #ef4444;
      font-weight: 600;
    }

    /* 3. MƏHSUL XÜLASƏSİ CƏDVƏLİ: first-child, last-child, nth-child */
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.85rem;
    }

    .summary-table td {
      padding: 10px 14px;
    }

    .summary-table tr:first-child td {
      background-color: #1e293b;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .summary-table tr:nth-child(even) td {
      background-color: #162035;
    }

    .summary-table tr:last-child td {
      border-top: 1px solid #334155;
      font-weight: 800;
      color: #38bdf8;
      font-size: 0.95rem;
    }

    /* 4. ŞƏRTLƏR SİYAHISI: :not(:last-child) */
    .terms-list {
      list-style: none;
      font-size: 0.8rem;
      color: #64748b;
    }

    .terms-list li:not(:last-child) {
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #1e293b;
    }

    /* 5. DÜYMƏLƏR: :hover, :active, :disabled */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      background-color: #38bdf8;
      color: #0b0f19;
      transition: all 0.15s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: #0284c7;
      color: #fff;
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      background-color: #1e293b;
      color: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    
    <!-- 1. :has() & :checked -->
    <div class="plans-group">
      <label class="plan-card">
        <div>
          <span class="plan-name">Aylıq Giriş</span>
          <small style="color: #64748b;">Hər ay yenilənir</small>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="plan-price">$19</span>
          <input type="radio" name="plan">
        </div>
      </label>

      <label class="plan-card">
        <div>
          <span class="plan-name">İllik Pro</span>
          <small style="color: #34d399;">2 ay pulsuz</small>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="plan-price">$190</span>
          <input type="radio" name="plan" checked>
        </div>
      </label>
    </div>

    <!-- 2. :focus & :has(.error-text) -->
    <div class="form-fields">
      <div class="field-box">
        <label>Ad və Soyad</label>
        <input type="text" placeholder="Adınızı daxil edin">
      </div>

      <div class="field-box">
        <label>E-poçt Ünvanı</label>
        <input type="text" value="istifadeci.mail.com">
        <span class="error-text">E-poçt formatı düzgün deyil (@ işarəsi yoxdur)</span>
      </div>
    </div>

    <!-- 3. :first-child, :last-child, :nth-child(even) -->
    <table class="summary-table">
      <tr>
        <td>Xidmət</td>
        <td style="text-align: right;">Məbləğ</td>
      </tr>
      <tr>
        <td>İllik Abunəlik</td>
        <td style="text-align: right;">$190.00</td>
      </tr>
      <tr>
        <td>ƏDV (18%)</td>
        <td style="text-align: right;">$34.20</td>
      </tr>
      <tr>
        <td>Yekun Ödəniş</td>
        <td style="text-align: right;">$224.20</td>
      </tr>
    </table>

    <!-- 4. :not(:last-child) -->
    <ul class="terms-list">
      <li>İstənilən vaxt ləğv edilə bilər</li>
      <li>14 günlük geri qaytarma zəmanəti</li>
      <li>Təhlükəsiz 256-bit SSL şifrələnmə</li>
    </ul>

    <!-- 5. :hover, :active, :disabled -->
    <button class="btn-submit" disabled>Ödənişi Tamamla (Disabled)</button>

  </div>

</body>
</html>
